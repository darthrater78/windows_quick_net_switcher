name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the notes script looks up the previous tag for the
          # compare link.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish single-file exe
        run: dotnet publish QuickNetSwitcher/QuickNetSwitcher.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Rename artifact
        shell: pwsh
        run: |
          Move-Item publish/QuickNetSwitcher.exe "publish/QuickNetSwitcher-v${{ steps.version.outputs.VERSION }}.exe"

      - name: Release notes from the changelog
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash .github/scripts/release-notes.sh "v${{ steps.version.outputs.VERSION }}" release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/QuickNetSwitcher-v${{ steps.version.outputs.VERSION }}.exe
          body_path: release-notes.md
