name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish single-file exe
        run: dotnet publish QuickNetSwitcher/QuickNetSwitcher.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Rename artifact
        shell: pwsh
        run: |
          Move-Item publish/QuickNetSwitcher.exe "publish/QuickNetSwitcher-v${{ steps.version.outputs.VERSION }}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/QuickNetSwitcher-v${{ steps.version.outputs.VERSION }}.exe
          generate_release_notes: true
