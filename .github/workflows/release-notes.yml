name: Release notes

# Rewrites an existing release's notes from the README's changelog, without
# re-tagging and without touching the attached executable. For releases published
# before the notes were generated this way, and for fixing a changelog entry after
# the fact -- re-running the original release run would replay the workflow file as
# it stood at that tag, which is no help.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to refresh, e.g. v1.3.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-notes-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  notes:
    # No build here, so the cheap runner rather than windows-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      # The input only ever reaches a script as this variable's value, never as
      # ${{ }} spliced into the script text.
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.3.0."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The README as it stood at that release, and full history so the previous
          # tag can be found for the compare link.
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build notes from the changelog
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash .github/scripts/release-notes.sh "$TAG" release-notes.md

      # No asset arguments -- the published executable is left exactly as it was.
      - name: Update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --notes-file release-notes.md
