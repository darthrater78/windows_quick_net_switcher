name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # For a commit that needs a CI run before it is tagged -- release.yml refuses to
  # publish a commit this workflow never passed on.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A change that touches only docs or images cannot change the exe, so the Windows
  # build is skipped for it. The run still succeeds, which is what release.yml's
  # "passing Build run for this commit" gate reads.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          # Empty on a manual run, which the script treats as "build".
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/ci-changes.sh "$BASE" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Skipped only when the diff is known to be docs-only; if the changes job
    # fails, the build still runs.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish single-file exe
        run: dotnet publish QuickNetSwitcher/QuickNetSwitcher.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuickNetSwitcher
          path: publish/QuickNetSwitcher.exe
          if-no-files-found: error
